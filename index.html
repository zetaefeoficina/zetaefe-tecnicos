<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zetaefe Técnicos · limpio</title>
<style>
:root{--navy:#10263f;--bg:#eef3f8;--text:#172033;--muted:#6e7b8d}
*{box-sizing:border-box}
body{margin:0;background:#dfe6ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
.phone{max-width:430px;margin:auto;min-height:100vh;background:var(--bg);box-shadow:0 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column}
.header{background:linear-gradient(180deg,#10263f,#0f2238);color:#fff;padding:20px 16px 15px}
.brand{font-size:27px;font-weight:850;letter-spacing:-.7px} .brand span{color:#4697ff}
.sub{opacity:.75;font-size:13px;margin-top:2px}
.filters{display:grid;grid-template-columns:1.18fr .82fr;grid-template-rows:auto auto;gap:8px 9px;margin-top:14px;align-items:start}
.box{background:#fff;color:var(--text);border-radius:14px;padding:9px 10px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.weekbox{grid-column:1;grid-row:1 / span 2;display:flex;flex-direction:column;justify-content:center}
.techbox{grid-column:2;grid-row:1;padding-top:7px;padding-bottom:7px}
.yearbox{grid-column:2;grid-row:2;padding-top:7px;padding-bottom:7px}
.label{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.5px;margin-bottom:4px}
select,input{width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:13px;font-weight:750;color:var(--text)}
.weekrow{display:grid;grid-template-columns:34px 1fr 34px;gap:5px;align-items:center}
.weekrow button{border:0;border-radius:9px;background:#e9eef5;font-size:19px;height:32px;cursor:pointer}
.range{font-size:11px;color:#66758a;margin-top:4px}
.main{padding:13px 11px 12px;flex:1}
.notice{font-size:11px;color:#6f7e90;margin:0 3px 12px}
.total{background:#fff;border-radius:13px;padding:10px 12px;margin:0 0 12px;display:flex;justify-content:space-between;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.day{margin-bottom:15px}
.dayhead{display:flex;justify-content:space-between;align-items:center;padding:3px 4px 7px}
.dayhead h2{margin:0;font-size:18px} .count{font-size:12px;color:#728094}
.card{border-radius:15px;padding:13px 12px;margin:8px 0;box-shadow:0 4px 12px rgba(19,35,58,.07);border-left:6px solid rgba(0,0,0,.16);position:relative}
.card h3{margin:0 0 9px;font-size:15px;line-height:1.25;padding-right:66px}
.meta{font-size:12px;display:grid;gap:4px}
.tag{position:absolute;right:9px;top:9px;background:rgba(255,255,255,.72);padding:5px 8px;border-radius:999px;font-size:10px;font-weight:850;max-width:115px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{background:#fff;border-radius:14px;padding:22px 14px;text-align:center;color:#77869a}
.bottombar{height:56px;background:#fff;border-top:1px solid #dde5ee;box-shadow:0 -2px 10px rgba(0,0,0,.04);flex:0 0 auto}
</style>
</head>
<body>
<div class="phone">
  <header class="header">
    <div class="brand">Zetaefe <span>Técnicos</span></div>
    <div class="sub">Planificación semanal</div>
    <div class="filters">
      <div class="box weekbox">
        <div class="label">SEMANA</div>
        <div class="weekrow">
          <button id="prev">‹</button>
          <select id="week"></select>
          <button id="next">›</button>
        </div>
        <div class="range" id="range"></div>
      </div>
      <div class="box techbox">
        <div class="label">TÉCNICO</div>
        <select id="tech"></select>
      </div>
      <div class="box yearbox">
        <div class="label">AÑO</div>
        <input id="year" type="number" min="2026" max="2030" value="2026">
      </div>
    </div>
  </header>

  <main class="main">
    <div class="total"><span id="selLabel">TODOS</span><strong id="total">0 eventos</strong></div>
    <div id="agenda"></div>
  </main>

  <div class="bottombar"></div>
</div>

<script>
const techs=["TODOS", "BERNARDO", "IBAN", "JOSE JUAN", "LUIS ", "LUISMA", "SAMUEL", "SERGIO", "GUILLERMO", "VICTORIA", "Ruko Julian", "Dani Sonotec", "Ruben Soriano", "Quino Músico", "Ángel Witos", "Oscar Mora Sonido", "Gines"];
const events=[{"title": "PERDIDO EN LOS 80 - TERRASSA", "date": "2026-10-09", "venue": "Sala Crespi", "time": "20:30", "tech": "Witos y preguntar a Zeus"}, {"title": "DREAMING BUBBLES - OURENSE", "date": "2026-10-09", "venue": "Auditorio Municipal de Ourense", "time": "19:00", "tech": "Guillermo"}, {"title": "INDISCRETOS (Tributo Músical) - San Fulgencio", "date": "2026-10-09", "venue": "Recinto Ferial", "time": "", "tech": "Gines Road"}, {"title": "DREAMING BUBBLES - VIGO", "date": "2026-10-10", "venue": "Teatro Salesianos", "time": "17:30", "tech": "Guillermo"}, {"title": "PERDIDO EN LOS 80 - TERRASSA", "date": "2026-10-10", "venue": "Sala Crespi", "time": "19:00", "tech": "Witos"}, {"title": "IMAGILUSION - ALCOY", "date": "2026-10-10", "venue": "Alcoi Plaza Teatre", "time": "12:00", "tech": "Sergio"}, {"title": "IMPROHÉROES - BENIEL", "date": "2026-10-10", "venue": "Teatro Pujarte", "time": "20:30", "tech": "Oscar posible"}, {"title": "TRIBUTO A HOMBRES G - PILAR DE LA HORADADA", "date": "2026-10-10", "venue": "Recinto Ferial", "time": "", "tech": "Gines Road"}, {"title": "DAVID DOMINGUEZ - SAN FÉLIX DE GUÍXOLS", "date": "2026-10-10", "venue": "Sala las Vegas", "time": "19:30", "tech": "Luisma"}, {"title": "DREAMING BUBBLES - SANTIAGO DE COMPOSTELA", "date": "2026-10-11", "venue": "Teatro Compostela (antiguo Teatro La Salle)", "time": "17:00", "tech": "Guillermo"}, {"title": "El Pequeño Mundo de la Música - San Fulgencio", "date": "2026-10-12", "venue": "Carpa Municipal", "time": "19:00", "tech": "Bernardo"}, {"title": "DREAMING BUBBLES - PILAR DE LA HORADADA", "date": "2026-10-13", "venue": "Carpa Municipal", "time": "19:00", "tech": "Guillermo"}, {"title": "EL RARO DE LOS 90 - Gernika (Bizkaia)", "date": "2026-10-16", "venue": "Elai-Alai Aretoa", "time": "19:30", "tech": "Luisma"}, {"title": "UN GENIO CON MUCHA MAGIA - BURGOS", "date": "2026-10-17", "venue": "Casa de Cultura de Gamonal", "time": "19:00", "tech": "Jose Juan"}, {"title": "MAGIA DESDE EL FUTURO - ALGUAZAS", "date": "2026-10-17", "venue": "Teatro IV Centenario de Alguazas", "time": "", "tech": "Samuel"}, {"title": "PERDIDO EN LOS 80 - PEDROÑERAS (Cuenca)", "date": "2026-10-17", "venue": "Auditorio de las Pedroñeras", "time": "20:00", "tech": "Witos"}, {"title": "EL RARO DE LOS 90 - Zalla (Bizkaia)", "date": "2026-10-17", "venue": "Zalla Zine Antzokia", "time": "19:30", "tech": "Luisma"}, {"title": "IMAGILUSION - VELEZ RUBIO", "date": "2026-10-17", "venue": "Teatro Óvalo Velez Rubio", "time": "18:00", "tech": "Sergio"}, {"title": "EL RARO DE LOS 90 - EIBAR", "date": "2026-10-18", "venue": "Salón de Actos UNI Eibar Ermua", "time": "19:00", "tech": "Luisma"}, {"title": "CAPERUCITA Y FEROZ - ELCHE", "date": "2026-10-18", "venue": "La Lonja", "time": "", "tech": "Bernardo"}, {"title": "POSITIVAMENTE (Motivación) - ORIHUELA", "date": "2026-10-18", "venue": "Teatro circo Atanasio", "time": "19:00", "tech": "Oscar"}, {"title": "PERDIDO EN LOS 80 - SAN FULGENCIO", "date": "2026-10-18", "venue": "Teatro Cardenal Belluga", "time": "19:00", "tech": "witos"}, {"title": "EL LOCO SHOW - SAN VICENTE DE RASPEIG", "date": "2026-10-18", "venue": "Casa de cultura de San Vicente", "time": "18:00", "tech": "Samuel"}, {"title": "IMAGILUSION - ALCANTARILLA", "date": "2026-10-18", "venue": "Centro Cultural Infanta Elena", "time": "12:30", "tech": "Sergio"}];
const rules=[
  {contains:"???",bg:"#FFD1D1",fg:"#172033"},
  {contains:"preguntar",bg:"#FFD1D1",fg:"#172033"},
  {contains:"Guillermo",bg:"#00FFFF",fg:"#172033"},
  {contains:"Witos",bg:"#FF9900",fg:"#172033"},
  {contains:"Gines",bg:"#D1FFE0",fg:"#172033"},
  {contains:"Sergio",bg:"#FFFF00",fg:"#172033"},
  {contains:"Oscar",bg:"#EAD1FF",fg:"#172033"},
  {contains:"Luisma",bg:"#FF00FF",fg:"#FFFFFF"},
  {contains:"Bernardo",bg:"#8C332B",fg:"#FFFFFF"},
  {contains:"Jose Juan",bg:"#FFB772",fg:"#172033"},
  {contains:"Samuel",bg:"#6AA84F",fg:"#172033"},
  {contains:"Shermo",bg:"#9EE5EA",fg:"#172033"},
  {contains:"Victoria",bg:"#B2C6FF",fg:"#172033"},
  {contains:"Iban",bg:"#D1E5FF",fg:"#172033"},
  {contains:"Ruko",bg:"#D1FFE0",fg:"#172033"},
  {contains:"Dani Sonotec",bg:"#DBD1B7",fg:"#172033"},
  {contains:"Ruben Soriano",bg:"#C1E5D1",fg:"#172033"},
  {contains:"Quino",bg:"#EFD1A8",fg:"#172033"},
  {contains:"Sala",bg:"#DBDBDB",fg:"#172033"},
  {contains:"Luis ",bg:"#D6C1F2",fg:"#172033"}
];
const fallback={bg:"#F4F7FF",fg:"#172033"};
function norm(s){return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function styleFor(s){const n=norm(s); for(const r of rules) if(n.includes(norm(r.contains))) return r; return fallback;}
function aliases(t){return {
  "Ángel Witos":["witos"],"Oscar Mora Sonido":["oscar"],"Ruko Julian":["ruko"],
  "Dani Sonotec":["dani sonotec","dani"],"Ruben Soriano":["ruben soriano","ruben"],
  "Quino Músico":["quino"],"LUIS ":["luis "]
}[t] || [t];}
function matchTech(selected,text){ if(selected==="TODOS") return true; return aliases(selected).some(k=>norm(text).includes(norm(k))); }
function isoWeekData(d){ const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-day); const ys=new Date(Date.UTC(x.getUTCFullYear(),0,1)); const week=Math.ceil((((x-ys)/86400000)+1)/7); return {year:x.getUTCFullYear(),week}; }
function mondayOfWeek(year,week){ const jan4=new Date(Date.UTC(year,0,4)); const day=jan4.getUTCDay()||7; const mon=new Date(jan4); mon.setUTCDate(jan4.getUTCDate()-day+1+(week-1)*7); return mon; }
function fmtDate(d){return d.toLocaleDateString("es-ES",{day:"2-digit",month:"short",timeZone:"UTC"})}
function dayTitle(d){return d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"short",timeZone:"UTC"}).replace(/^./,c=>c.toUpperCase())}

const wsel=document.getElementById("week"), tsel=document.getElementById("tech"), year=document.getElementById("year");
for(let i=1;i<=53;i++){const o=document.createElement("option");o.value=i;o.textContent="Semana "+String(i).padStart(2,"0");wsel.appendChild(o)}
techs.forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=t.trim();tsel.appendChild(o)})
wsel.value="41"; year.value="2026"; tsel.value="TODOS";

function render(){
  const w=+wsel.value, y=+year.value, tech=tsel.value;
  const mon=mondayOfWeek(y,w), sun=new Date(mon); sun.setUTCDate(mon.getUTCDate()+6);
  document.getElementById("range").textContent=fmtDate(mon)+" — "+fmtDate(sun);
  document.getElementById("selLabel").textContent=tech.trim();
  const filtered=events.filter(e=>{const d=new Date(e.date+"T12:00:00Z"); const iw=isoWeekData(d); return iw.year===y && iw.week===w && matchTech(tech,e.tech);}).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||"99").localeCompare(b.time||"99"));
  document.getElementById("total").textContent=filtered.length+" "+(filtered.length===1?"evento":"eventos");
  const ag=document.getElementById("agenda");
  if(!filtered.length){ag.innerHTML='<div class="empty">No hay eventos para esta semana y este técnico.</div>'; return;}
  const groups={}; filtered.forEach(e=>(groups[e.date]??=[]).push(e));
  ag.innerHTML=Object.entries(groups).map(([date,list])=>{ const d=new Date(date+"T12:00:00Z"); return `<section class="day"><div class="dayhead"><h2>${dayTitle(d)}</h2><span class="count">${list.length} ${list.length===1?"evento":"eventos"}</span></div>` + list.map(e=>{ const s=styleFor(e.tech); return `<article class="card" style="background:${s.bg};color:${s.fg}"><h3>${e.title}</h3><div class="tag" style="color:${s.fg}">${e.tech||"Sin técnico"}</div><div class="meta" style="color:${s.fg}"><span>📍 ${e.venue||"Sin recinto"}</span>${e.time?`<span>🕒 ${e.time}</span>`:""}<span>🔧 ${e.tech||"Sin técnico"}</span></div></article>`; }).join("") + "</section>"; }).join("");
}
[wsel,tsel,year].forEach(el=>el.addEventListener("change",render));
document.getElementById("prev").onclick=()=>{let w=+wsel.value,y=+year.value; if(w===1){w=53;y--} else w--; wsel.value=w; year.value=y; render();};
document.getElementById("next").onclick=()=>{let w=+wsel.value,y=+year.value; if(w===53){w=1;y++} else w++; wsel.value=w; year.value=y; render();};
render();
</script>
</body>
</html>
